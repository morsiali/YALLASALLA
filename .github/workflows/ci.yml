name: ci
on: { push: { branches: ['**'] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: yalasala_owner, POSTGRES_PASSWORD: owner_dev_pw, POSTGRES_DB: yalasala }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yalasala_owner" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_BASE: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Server unit, integration, RLS and policy tests (real PostgreSQL)
        run: npm run test:server
      - name: Web unit tests
        run: npm run test -w web
      - run: npm run build -w web
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end tests (EN/AR, mobile, accessibility, journeys)
        run: npm run test:e2e
        env: { CHROMIUM_PATH: '' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: web/test-results }
